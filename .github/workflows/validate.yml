name: Validate catalog

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install check-jsonschema==0.33.3
      - run: check-jsonschema --schemafile docs/schemas/catalog-v2.schema.json docs/snapshots/catalog-*.json
      - run: check-jsonschema --schemafile docs/schemas/head-v1.schema.json docs/head.json
